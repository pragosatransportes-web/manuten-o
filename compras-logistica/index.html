<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fluxo Logística → Compras</title>
<style>
:root{color-scheme:light;--bg:#f5f5f3;--surface:#ffffff;--surface-2:#fafafa;--border:rgba(0,0,0,0.09);--border-2:rgba(0,0,0,0.14);--text:#18181b;--text-2:#52525b;--text-3:#a1a1aa;--accent:#2563eb;--green:#16a34a;--amber:#d97706;--red:#dc2626;--blue:#0891b2;--slate:#64748b;--radius:10px;--shadow:0 1px 3px rgba(0,0,0,0.07)}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--text);font-size:13.5px;line-height:1.55;-webkit-font-smoothing:antialiased}
.app-header{background:var(--surface);border-bottom:1px solid var(--border);padding:12px 20px;display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}
.app-header-left h1{font-size:15px;font-weight:600}
.app-header-left p{font-size:11px;color:var(--text-3);margin-top:1px}
.header-right{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.perfil-box{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--text-2)}
.perfil-box select{font-family:inherit;font-size:12px;padding:5px 8px;border:1px solid var(--border-2);border-radius:6px;background:var(--surface);color:var(--text);cursor:pointer}
.sync-pill{font-size:11px;padding:4px 9px;border-radius:20px;display:flex;align-items:center;gap:5px;background:var(--surface-2);border:1px solid var(--border);color:var(--text-2)}
.sync-dot{width:7px;height:7px;border-radius:50%;background:var(--text-3)}
.sync-pill.remote .sync-dot{background:var(--green)}
.sync-pill.syncing .sync-dot{background:var(--amber)}
.sync-pill.error .sync-dot{background:var(--red)}
.nav{background:var(--surface);border-bottom:1px solid var(--border);display:flex;padding:0 20px;gap:2px;align-items:center;overflow-x:auto}
.nav-btn{padding:10px 14px;font-size:12.5px;font-weight:400;color:var(--text-2);border:none;background:none;cursor:pointer;border-bottom:2px solid transparent;transition:color .12s;white-space:nowrap;position:relative;font-family:inherit}
.nav-btn:hover{color:var(--text)}
.nav-btn.active{color:var(--accent);border-bottom-color:var(--accent);font-weight:500}
.nav-badge{display:inline-block;margin-left:6px;background:var(--amber);color:#fff;font-size:9.5px;font-weight:700;min-width:16px;height:16px;line-height:16px;text-align:center;border-radius:8px;padding:0 4px;vertical-align:middle}
.nav-badge.zero{background:var(--text-3)}
.main{padding:20px;max-width:100%;margin:0 auto}
.section{display:none}.section.active{display:block}
.grid-4{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.grid-3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:860px){.grid-4{grid-template-columns:1fr 1fr}.grid-3,.grid-2{grid-template-columns:1fr}}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:14px 16px;box-shadow:var(--shadow)}
.kpi{display:flex;flex-direction:column;gap:2px}
.kpi .n{font-size:26px;font-weight:700;letter-spacing:-.02em}
.kpi .l{font-size:11px;color:var(--text-3);text-transform:uppercase;letter-spacing:.05em;font-weight:600}
.kpi .s{font-size:11px;color:var(--text-2)}
.kpi.amber .n{color:var(--amber)}.kpi.blue .n{color:var(--blue)}.kpi.green .n{color:var(--green)}.kpi.slate .n{color:var(--slate)}
.sh{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;gap:10px;flex-wrap:wrap}
.sh h2{font-size:14px;font-weight:600}
.sh .sub{font-size:11.5px;color:var(--text-3)}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.toolbar input[type=text],.toolbar select{font-family:inherit;font-size:12px;padding:6px 9px;border:1px solid var(--border-2);border-radius:6px;background:var(--surface);color:var(--text)}
.toolbar input[type=text]{min-width:190px}
.btn{font-family:inherit;font-size:12px;padding:6px 12px;border:1px solid var(--border-2);border-radius:6px;background:var(--surface);color:var(--text-2);cursor:pointer;display:inline-flex;align-items:center;gap:5px;white-space:nowrap;transition:background .1s,color .1s}
.btn:hover{background:var(--bg);color:var(--text)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{background:#1d4ed8;color:#fff}
.btn.green{background:var(--green);border-color:var(--green);color:#fff}.btn.green:hover{background:#15803d}
.btn.sm{padding:3px 8px;font-size:11px}
.btn.ghost-red{color:var(--red);border-color:transparent}.btn.ghost-red:hover{background:#fef2f2}
.table-wrap{overflow-x:auto;border:1px solid var(--border);border-radius:var(--radius);background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:12px}
th{text-align:left;font-weight:600;font-size:10.5px;text-transform:uppercase;letter-spacing:.04em;color:var(--text-3);padding:8px 8px;border-bottom:1px solid var(--border);background:var(--surface-2);position:sticky;top:0;white-space:nowrap}
td{padding:5px 8px;border-bottom:1px solid var(--border);vertical-align:middle}
tr:last-child td{border-bottom:none}
tr:hover td{background:var(--surface-2)}
td input,td select,td textarea{font-family:inherit;font-size:12px;padding:4px 6px;border:1px solid transparent;border-radius:5px;background:transparent;color:var(--text);width:100%;min-width:70px}
td input:hover,td select:hover,td textarea:hover{border-color:var(--border)}
td input:focus,td select:focus,td textarea:focus{border-color:var(--accent);background:var(--surface);outline:none}
td input:disabled,td select:disabled{color:var(--text);opacity:1;cursor:default}
td.num input{text-align:right}
.badge{display:inline-flex;align-items:center;gap:4px;font-size:10.5px;font-weight:600;padding:2px 8px;border-radius:20px;white-space:nowrap}
.badge::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor;opacity:.9}
.b-rascunho{background:#f1f5f9;color:var(--slate)}
.b-pedido{background:#fef3c7;color:#92400e}
.b-encomenda{background:#cffafe;color:#155e75}
.b-concluido{background:#dcfce7;color:#166534}
.b-sem_ne{background:#f3f4f6;color:#6b7280}
.chip{display:inline-block;font-size:10px;padding:1px 7px;border-radius:5px;background:var(--surface-2);border:1px solid var(--border);color:var(--text-2);font-weight:500}
.empty{text-align:center;color:var(--text-3);padding:40px 20px;font-size:12.5px}
.bar-row{display:flex;align-items:center;gap:10px;margin-bottom:7px;font-size:12px}
.bar-row .lbl{width:130px;flex-shrink:0;color:var(--text-2)}
.bar-track{flex:1;background:var(--surface-2);border-radius:5px;height:16px;overflow:hidden;border:1px solid var(--border)}
.bar-fill{height:100%;background:var(--accent);border-radius:5px 0 0 5px}
.bar-row .val{width:44px;text-align:right;font-variant-numeric:tabular-nums;color:var(--text)}
.task{border:1px solid var(--border);border-radius:var(--radius);padding:12px 14px;margin-bottom:10px;background:var(--surface)}
.task-head{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;margin-bottom:8px}
.task-title{font-size:13px;font-weight:600}
.task-meta{font-size:11.5px;color:var(--text-2);margin-top:2px}
.task-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;margin:10px 0}
.field label{display:block;font-size:10px;text-transform:uppercase;letter-spacing:.04em;color:var(--text-3);font-weight:600;margin-bottom:3px}
.field input,.field textarea,.field select{font-family:inherit;font-size:12.5px;padding:6px 8px;border:1px solid var(--border-2);border-radius:6px;background:var(--surface);color:var(--text);width:100%}
.info-line{font-size:12px;color:var(--text-2)}
.info-line b{color:var(--text);font-weight:600}
.hist{font-size:11.5px;color:var(--text-2);border-left:2px solid var(--border);padding-left:10px;margin-top:6px}
.hist div{margin-bottom:2px}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.4);display:flex;align-items:center;justify-content:center;z-index:50;padding:20px}
.modal{background:var(--surface);border-radius:12px;max-width:560px;width:100%;max-height:85vh;overflow:auto;padding:20px;box-shadow:0 10px 40px rgba(0,0,0,.2)}
.modal h3{font-size:15px;margin-bottom:14px}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#18181b;color:#fff;font-size:12.5px;padding:9px 16px;border-radius:8px;z-index:60;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.show{opacity:1}
.banner{background:#fffbeb;border:1px solid #fde68a;color:#92400e;padding:12px 16px;border-radius:var(--radius);font-size:12.5px;margin-bottom:16px}
.banner code{background:#fef3c7;padding:1px 5px;border-radius:4px;font-size:11.5px}
.muted{color:var(--text-3);font-size:11px}
.right{text-align:right}
/* estado Alteração pendente (destaque amarelo) */
.b-alteracao{background:#fef08a;color:#854d0e}
tr.row-alt td{background:#fefce8}
tr.row-alt:hover td{background:#fef9c3}
tr.row-rascunho td{background:#fffbeb}
tr.row-rascunho:hover td{background:#fef3c7}
tr.row-rascunho td:first-child{box-shadow:inset 4px 0 0 var(--amber)}
tr.row-rascunho-old td:first-child{box-shadow:inset 4px 0 0 var(--red)}
.chip-old{display:inline-block;font-size:9.5px;font-weight:700;padding:1px 6px;border-radius:6px;background:#fee2e2;color:#b91c1c;margin-left:5px;white-space:nowrap}
/* cartões de Compras: campos com rótulo */
.task-fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:8px 0 4px}
.task-fields>div{display:flex;flex-direction:column;gap:1px}
.tf-label{font-size:9.5px;text-transform:uppercase;letter-spacing:.04em;color:var(--text-3);font-weight:700}
.tf-val{font-size:13px;font-weight:600;color:var(--text)}
.vigor-note{background:#dbeafe;border:1px solid #bfdbfe;color:#1e40af;padding:6px 10px;border-radius:7px;font-size:12.5px;margin-top:6px;font-weight:600}
.alt-note{background:#fef9c3;border:1px solid #fde68a;color:#854d0e;padding:7px 10px;border-radius:7px;font-size:12px;margin:8px 0}
/* login */
.login-bg{position:fixed;inset:0;background:linear-gradient(135deg,#1e293b,#0f172a);display:flex;align-items:center;justify-content:center;z-index:100;padding:20px}
.login-card{background:var(--surface);border-radius:14px;padding:28px;width:100%;max-width:360px;box-shadow:0 20px 60px rgba(0,0,0,.4)}
.login-card h2{font-size:17px;margin-bottom:4px}
.login-card>p{font-size:12px;color:var(--text-3);margin-bottom:14px}
.login-card label{display:block;font-size:10.5px;text-transform:uppercase;letter-spacing:.04em;color:var(--text-3);font-weight:600;margin:12px 0 4px}
.login-card select,.login-card input{width:100%;font-family:inherit;font-size:13px;padding:9px 10px;border:1px solid var(--border-2);border-radius:7px;background:var(--surface);color:var(--text)}
.login-err{color:var(--red);font-size:12px;margin-top:8px;min-height:16px}
.session-box{display:flex;align-items:center;gap:8px}
.session-role{font-weight:600;color:var(--text);font-size:12.5px}
.session-role::before{content:"●";color:var(--green);margin-right:4px;font-size:9px;vertical-align:middle}
/* mensagens / balão */
.msg-btn{position:relative;border:1px solid var(--border-2);background:var(--surface);border-radius:6px;padding:3px 7px;cursor:pointer;font-size:13px;line-height:1;color:var(--text-2)}
.msg-btn:hover{background:var(--bg);color:var(--text)}
.msg-count{position:absolute;top:-6px;right:-6px;background:var(--red);color:#fff;font-size:9px;font-weight:700;min-width:15px;height:15px;line-height:15px;border-radius:8px;text-align:center;padding:0 3px}
.conv{max-height:340px;overflow:auto;display:flex;flex-direction:column;gap:8px;padding:8px 2px;margin:8px 0;border-top:1px solid var(--border);border-bottom:1px solid var(--border)}
.bubble{max-width:82%;padding:7px 11px;border-radius:12px;font-size:12.5px;line-height:1.45;word-break:break-word}
.bubble .meta{font-size:10px;color:var(--text-3);margin-bottom:2px;font-weight:600}
.bubble.mine{align-self:flex-end;background:var(--accent);color:#fff;border-bottom-right-radius:3px}
.bubble.mine .meta{color:rgba(255,255,255,.85)}
.bubble.theirs{align-self:flex-start;background:var(--surface-2);border:1px solid var(--border);border-bottom-left-radius:3px}
.conv-item{border:1px solid var(--border);border-radius:var(--radius);padding:12px 14px;margin-bottom:10px;background:var(--surface);cursor:pointer;transition:background .1s}
.conv-item:hover{background:var(--surface-2)}
.conv-item.unread{border-left:3px solid var(--amber)}
.recipient-row{display:flex;gap:8px;align-items:center;margin-top:8px}
.recipient-row select{max-width:160px;font-family:inherit;font-size:12.5px;padding:7px 8px;border:1px solid var(--border-2);border-radius:7px;background:var(--surface);color:var(--text)}
.recipient-row input{flex:1;font-family:inherit;font-size:12.5px;padding:7px 9px;border:1px solid var(--border-2);border-radius:7px;background:var(--surface);color:var(--text)}
.ne-ok{color:var(--green);font-weight:700}
.ne-no{color:var(--text-3)}
/* multi-select filtros */
.ms{position:relative;display:inline-block}
.ms-btn{font-family:inherit;font-size:12px;padding:6px 9px;border:1px solid var(--border-2);border-radius:6px;background:var(--surface);color:var(--text-2);cursor:pointer;display:inline-flex;align-items:center;gap:4px;white-space:nowrap}
.ms-btn:hover{color:var(--text)}
.ms-btn.on{border-color:var(--accent);color:var(--accent);font-weight:600}
.ms-panel{position:absolute;top:calc(100% + 4px);left:0;z-index:20;background:var(--surface);border:1px solid var(--border-2);border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.14);padding:6px;min-width:200px;max-height:300px;overflow:auto}
.ms-opt{display:flex;align-items:center;gap:7px;padding:5px 7px;border-radius:5px;font-size:12.5px;cursor:pointer;white-space:nowrap}
.ms-opt:hover{background:var(--surface-2)}
.ms-opt input{width:auto;margin:0}
.km-flt{display:inline-flex;align-items:center;gap:5px;font-size:12px;color:var(--text-2)}
.km-flt input{width:64px;font-family:inherit;font-size:12px;padding:6px 7px;border:1px solid var(--border-2);border-radius:6px;background:var(--surface);color:var(--text)}
/* colunas ajustáveis */
.col-resizer{position:absolute;top:0;right:0;width:6px;height:100%;cursor:col-resize;user-select:none}
.col-resizer:hover{background:var(--accent);opacity:.35}
</style>
</head>
<body>
<header class="app-header">
  <div class="app-header-left">
    <h1>Fluxo Logística → Compras → Administrativo</h1>
    <p>Construções Pragosa · negociação de transportes e abertura de notas de encomenda</p>
  </div>
  <div class="header-right">
    <div class="session-box" id="sessionBox"></div>
    <div class="sync-pill" id="syncPill"><span class="sync-dot"></span><span id="syncLbl">A ligar…</span></div>
  </div>
</header>
<nav class="nav" id="nav"></nav>
<main class="main">
  <section class="section" id="sec-painel"></section>
  <section class="section" id="sec-logistica"></section>
  <section class="section" id="sec-compras"></section>
  <section class="section" id="sec-admin"></section>
  <section class="section" id="sec-transp"></section>
  <section class="section" id="sec-mensagens"></section>
</main>
<div id="modalRoot"></div>
<div id="loginRoot"></div>
<div class="toast" id="toast"></div>

/* ===== Supabase mapping ===== */

  km:l.km===""||l.km==null?null:Number(l.km),

  ne_data:l.neData||null,compras_obs:l.comprasObs||null,pedido_data:l.pedidoData||null,
  concluido_data:l.concluidoData||null,historico:l.historico||[],updated_at:nowISO(),updated_by:perfil
}}
function fromDb(r){return{
  id:r.id,categoria:r.categoria,idTransp:r.id_transp,nomeTransp:r.nome_transp,servico:r.servico,
  carga:r.carga,descarga:r.descarga,origem:r.origem,unidade:r.unidade,
  preco:r.preco==null?"":r.preco,km:r.km==null?"":r.km,obs:r.obs||"",precisaNE:r.precisa_ne!==false,

}}
function tToDb(t){return{id:t.id,nome:t.nome,nif:t.nif||null,contacto:t.contacto||null,telefone:t.telefone||null,email:t.email||null,ativo:t.ativo||"Sim",obs:t.obs||null}}
function tFromDb(r){return{id:r.id,nome:r.nome,nif:r.nif||"",contacto:r.contacto||"",telefone:r.telefone||"",email:r.email||"",ativo:r.ativo||"Sim",obs:r.obs||""}}
function mToDb(m){return{id:m.id,linha_id:m.linhaId,de:m.de,para:m.para,texto:m.texto,ts:m.ts,lida_por:m.lidaPor||[]}}
function mFromDb(r){return{id:r.id,linhaId:r.linha_id,de:r.de,para:r.para,texto:r.texto,ts:r.ts,lidaPor:r.lida_por||[]}}

/* ===== Ligação ===== */
function setSync(lbl,cls){$("#syncLbl").textContent=lbl;$("#syncPill").className="sync-pill "+(cls||"")}
/* ===== Autenticação (gate de perfil) ===== */
function renderSessionBox(){const el=$("#sessionBox");if(el)el.innerHTML=`<span class="session-role">${esc(perfil)}</span><button class="btn sm" onclick="logout()">Sair</button>`}
function renderLogin(){
  $("#loginRoot").innerHTML=`<div class="login-bg"><div class="login-card">
    <h2>Fluxo Logística → Compras</h2>
    <p>Construções Pragosa · inicia sessão para continuar</p>
    <label>Perfil</label>
    <select id="lg-role"><option>Logística</option><option>Compras</option><option>Administrativo</option></select>
    <label>Password</label>
    <input id="lg-pass" type="password" placeholder="••••••••" onkeydown="if(event.key==='Enter')doLogin()">
    <div class="login-err" id="lg-err"></div>
    <button class="btn primary" style="width:100%;margin-top:8px;justify-content:center" onclick="doLogin()">Entrar</button>
  </div></div>`;
  setTimeout(()=>{const el=$("#lg-pass");el&&el.focus()},60);
}
async function doLogin(){
  const role=$("#lg-role").value, pass=($("#lg-pass").value||"").trim(), err=$("#lg-err");
  const email=ROLE_EMAIL[role];
  if(!sb){if(err)err.textContent="Sem ligação — recarrega a página.";return}
  if(!email){if(err)err.textContent="Perfil inválido.";return}
  if(err)err.textContent="A entrar…";
  const {data,error}=await sb.auth.signInWithPassword({email,password:pass});
  if(error){if(err)err.textContent="Password incorreta para este perfil.";return}
  perfil=roleFromEmail(data.user&&data.user.email)||role;
  $("#loginRoot").innerHTML=""; startApp();
}
async function logout(){try{if(sb)await sb.auth.signOut()}catch(e){}perfil=null;location.reload()}

async function init(){
  if(!window.supabase?.createClient){renderLogin();setTimeout(()=>{const e=$("#lg-err");if(e)e.textContent="Biblioteca indisponível — recarrega a página.";},120);return}
  sb=window.supabase.createClient(SB_URL,SB_KEY);
  try{
    const {data:{session}}=await sb.auth.getSession();
    if(session&&session.user){const r=roleFromEmail(session.user.email);if(r){perfil=r;startApp();
      sb.auth.onAuthStateChange((ev,s)=>{if(ev==="SIGNED_OUT"){perfil=null;location.reload()}});
      return;}}
  }catch(e){console.warn("getSession",e)}
  renderLogin();
  sb.auth.onAuthStateChange((ev,s)=>{if(ev==="SIGNED_OUT"){perfil=null;renderLogin()}});
}
async function startApp(){
  renderSessionBox();
  if(!window._msClose){window._msClose=true;document.addEventListener("click",e=>{if(!e.target.closest(".ms"))document.querySelectorAll(".ms-panel").forEach(x=>x.hidden=true)})}
  buildNav();
  if(!sb){setSync("Sem ligação","error");render();return}
  try{
    setSync("A ligar…","syncing");
    await loadRemote();
    await consolidarInicial();
    subscribe();
    remoteOk=true;
    setSync("Partilhado em tempo real","remote");
  }catch(e){
    console.error(e);remoteOk=false;
    window._lastErr=(e&&e.message)?e.message:String(e);
    loadLocalPreview();
    await consolidarInicial();
    setSync("Pré-visualização local — ver Painel","error");
  }
  render();
}
function tentarLigar(){window._lastErr="";setSync("A ligar…","syncing");startApp()}
async function loadRemote(){
  const [tr,lr]=await Promise.all([
    sb.from("cl_transportadores").select("*").order("nome"),
    sb.from("cl_linhas").select("*")
  ]);
  if(tr.error||lr.error){throw (tr.error||lr.error)}
  state.transp=(tr.data||[]).map(tFromDb);
  state.linhas=(lr.data||[]).map(fromDb);
  await loadMensagens();
  if(state.linhas.length===0 && state.transp.length===0){
    await seedRemote();
    return loadRemote();
  }
}
async function loadMensagens(){
  try{
    const r=await sb.from("cl_mensagens").select("*");
    if(r.error){console.warn("cl_mensagens indisponível (falta migração?)",r.error.message);state.mensagens=[];return}
    state.mensagens=(r.data||[]).map(mFromDb);
  }catch(e){console.warn("cl_mensagens erro",e);state.mensagens=[]}
}
async function seedRemote(){
  setSync("A carregar dados iniciais…","syncing");
  const tps=SEED.transportadores.map(t=>tToDb(t));
  const lns=SEED.linhas.map((l,i)=>toDb({
    id:"L"+String(i+1).padStart(4,"0"),categoria:l.categoria,idTransp:l.idTransp,nomeTransp:l.nomeTransp,
    servico:l.servico,carga:l.carga,descarga:l.descarga,origem:l.origem,unidade:l.unidade,
    preco:l.preco,km:l.km,obs:l.obs,precisaNE:true,estado:"rascunho",historico:[{ts:nowISO(),quem:"sistema",txt:"Importado do Excel"}]
  }));
  for(let i=0;i<tps.length;i+=200){await sb.from("cl_transportadores").upsert(tps.slice(i,i+200),{onConflict:"id"})}
  for(let i=0;i<lns.length;i+=200){await sb.from("cl_linhas").upsert(lns.slice(i,i+200),{onConflict:"id"})}
}
function loadLocalPreview(){
  if(state.linhas.length)return;
  state.transp=SEED.transportadores.map(t=>({id:t.id,nome:t.nome,nif:t.nif||"",contacto:t.contacto||"",telefone:t.telefone||"",email:t.email||"",ativo:t.ativo||"Sim",obs:t.obs||""}));
  state.linhas=SEED.linhas.map((l,i)=>({id:"L"+String(i+1).padStart(4,"0"),categoria:l.categoria,idTransp:l.idTransp,nomeTransp:l.nomeTransp,servico:l.servico,carga:l.carga,descarga:l.descarga,origem:l.origem,unidade:l.unidade,preco:l.preco,km:l.km,obs:l.obs||"",precisaNE:true,estado:"rascunho",neNumero:"",neData:"",comprasObs:"",pedidoData:"",concluidoData:"",historico:[{ts:nowISO(),quem:"sistema",txt:"Importado do Excel"}]}));
}
/* Consolidação inicial: as linhas importadas do Excel são o histórico já
   negociado. Assume-se que a Logística já as enviou e que as Compras já
   emitiram a NE -> passam a "Encomenda Aberta". Só apanha linhas em rascunho
   cujo 1.º histórico é "Importado do Excel" (nunca linhas novas). Idempotente:
   depois de convertidas deixam de ser rascunho e não voltam a ser tocadas. */
async function consolidarInicial(){
  const alvo=state.linhas.filter(l=>l.estado==="rascunho" && l.historico && l.historico[0] && l.historico[0].txt==="Importado do Excel");
  if(!alvo.length)return;
  const ts=nowISO(), hoje=ts.slice(0,10);
  for(const l of alvo){
    l.estado="encomenda";
    l.precisaNE=true;
    l.pedidoData=l.pedidoData||ts;
    l.neData=l.neData||hoje;
    if(l.neNumero==null)l.neNumero="";
    l.historico=l.historico||[];
    l.historico.push(
      {ts,quem:"sistema",txt:"Enviado para Compras (histórico consolidado)"},
      {ts,quem:"sistema",txt:"Nota de encomenda emitida (histórico consolidado — n.º não registado)"}
    );
    await saveLinha(l);
  }
  toast(alvo.length+" linhas do Excel consolidadas como encomenda aberta");
}
function subscribe(){
  sb.channel("cl-live")
    .on("postgres_changes",{event:"*",schema:"public",table:"cl_linhas"},p=>applyRemote("linhas",p))
    .on("postgres_changes",{event:"*",schema:"public",table:"cl_transportadores"},p=>applyRemote("transp",p))
    .on("postgres_changes",{event:"*",schema:"public",table:"cl_mensagens"},p=>applyRemoteMsg(p))
    .subscribe();
}
function applyRemoteMsg(p){
  if(p.eventType==="DELETE"){const i=state.mensagens.findIndex(x=>x.id===p.old.id);if(i>=0)state.mensagens.splice(i,1)}
  else{const m=mFromDb(p.new);const i=state.mensagens.findIndex(x=>x.id===m.id);if(i>=0)state.mensagens[i]=m;else state.mensagens.push(m)}
  updateBadges();
  if(activeTab==="mensagens")renderMensagens();
  if(currentConvLine&&$("#convBox"))renderConversaModal(currentConvLine);
}
function applyRemote(kind,p){
  const map=kind==="linhas"?fromDb:tFromDb, arr=state[kind];
  if(p.eventType==="DELETE"){const id=p.old.id;const i=arr.findIndex(x=>x.id===id);if(i>=0)arr.splice(i,1)}
  else{const obj=map(p.new);const i=arr.findIndex(x=>x.id===obj.id);if(i>=0)arr[i]=obj;else arr.push(obj)}
  render();
}
async function saveLinha(l){const i=state.linhas.findIndex(x=>x.id===l.id);if(i>=0)state.linhas[i]=l;else state.linhas.push(l);if(sb&&remoteOk){const {error}=await sb.from("cl_linhas").upsert(toDb(l),{onConflict:"id"});if(error){toast("Erro ao guardar");console.error(error)}}}
async function delLinha(id){state.linhas=state.linhas.filter(x=>x.id!==id);if(sb&&remoteOk)await sb.from("cl_linhas").delete().eq("id",id)}
async function saveTransp(t){const i=state.transp.findIndex(x=>x.id===t.id);if(i>=0)state.transp[i]=t;else state.transp.push(t);if(sb&&remoteOk){const{error}=await sb.from("cl_transportadores").upsert(tToDb(t),{onConflict:"id"});if(error)toast("Erro ao guardar")}}
async function delTransp(id){state.transp=state.transp.filter(x=>x.id!==id);if(sb&&remoteOk)await sb.from("cl_transportadores").delete().eq("id",id)}

/* ===== Transições de fluxo ===== */
function hist(l,txt){l.historico=l.historico||[];l.historico.push({ts:nowISO(),quem:perfil,txt})}
async function enviarCompras(id){const l=getL(id);if(!l)return;l.estado="pedido";l.pedidoData=nowISO();hist(l,"Enviado para Compras");await saveLinha(l);toast("Enviado para Compras");render()}
async function marcarSemNE(id){const l=getL(id);if(!l)return;l.estado="sem_ne";l.precisaNE=false;hist(l,"Marcado sem necessidade de encomenda");await saveLinha(l);render()}
async function registarNE(id){const l=getL(id);if(!l)return;
  const de=document.getElementById("ne-data-"+id), oe=document.getElementById("ne-obs-"+id);
  const data=de?de.value:"", obs=oe?oe.value.trim():"";
  l.neData=data;l.comprasObs=obs;l.estado="encomenda";
  hist(l,"Encomenda aberta"+(data?" — data "+new Date(data).toLocaleDateString("pt-PT"):""));
  await saveLinha(l);toast("Encomenda registada");render()}
async function concluir(id){const l=getL(id);if(!l)return;l.estado="concluido";l.concluidoData=nowISO();hist(l,"Concluído");await saveLinha(l);render()}
async function reabrir(id){const l=getL(id);if(!l)return;l.estado=l.neNumero?"encomenda":"pedido";hist(l,"Reaberto");await saveLinha(l);render()}
function getL(id){return state.linhas.find(x=>x.id===id)}

/* Circuito fechado: só é possível eliminar uma linha que nunca foi aberta
   (ainda em rascunho e sem nunca ter sido enviada a Compras). */
function podeEliminar(l){return l && l.estado==="rascunho" && !l.pedidoData}

/* ===== Edição com confirmação obrigatória (Logística) ===== */
const CAMPOS_LOG={servico:"Serviço/Rota",carga:"Carga",descarga:"Descarga",origem:"Origem",unidade:"Unidade",preco:"Preço",km:"Km",precisaNE:"Precisa NE"};
function stageEdit(id,campo,valor){
  pendingEdits[id]=pendingEdits[id]||{};
  pendingEdits[id][campo]=valor;
  const b=document.getElementById("save-"+id); if(b)b.hidden=false;
}
function calcChanges(l,p){
  const changes=[];
  for(const [f,v] of Object.entries(p||{})){
    let oldv=l[f], newv=v;
    if(f==="preco"||f==="km"){oldv=(oldv===""||oldv==null)?"":Number(oldv);newv=(newv===""||newv==null)?"":Number(newv)}
    if(f==="precisaNE"){oldv=l.precisaNE?"Sim":"Não";newv=v?"Sim":"Não"}
    if(String(oldv)===String(newv))continue;
    changes.push({f,val:v,txt:`${CAMPOS_LOG[f]||f}: ${oldv===""||oldv==null?"—":oldv} → ${newv===""||newv==null?"—":newv}`});
  }
  return changes;
}
async function guardarAlteracao(id){
  const l=getL(id), p=pendingEdits[id];
  if(!l||!p){toast("Sem alterações");return}
  const changes=calcChanges(l,p);
  if(!changes.length){delete pendingEdits[id];toast("Sem alterações");render();return}
  const nuncaAberta=(l.estado==="rascunho" && !l.pedidoData);
  if(nuncaAberta){
    changes.forEach(c=>l[c.f]=c.val);
    delete pendingEdits[id];
    hist(l,"Editado: "+changes.map(c=>c.txt).join("; "));
    await saveLinha(l);toast("Guardado");render();
  }else{
    pedirVigor(id);   // linha já aberta → pedir data de entrada em vigor antes de enviar
  }
}
function pedirVigor(id){
  const l=getL(id);if(!l)return;
  const changes=calcChanges(l,pendingEdits[id]);
  const hoje=new Date().toISOString().slice(0,10);
  modal(`<h3>Enviar alteração às Compras</h3>
    <div class="info-line" style="margin-bottom:8px">${esc(l.servico||l.id)} · ${esc(l.nomeTransp||l.idTransp)}</div>
    <div class="alt-note" style="margin-bottom:12px"><b>Alteração:</b> ${changes.map(c=>esc(c.txt)).join("; ")}</div>
    <div class="field" style="margin-bottom:14px"><label>Data em que a alteração entra em vigor *</label><input id="vigor-data" type="date" value="${hoje}"></div>
    <div style="text-align:right;display:flex;gap:8px;justify-content:flex-end"><button class="btn" onclick="closeModal()">Cancelar</button><button class="btn primary" onclick="commitAlteracao('${id}')">Enviar às Compras →</button></div>`);
}
async function commitAlteracao(id){
  const l=getL(id), p=pendingEdits[id];
  if(!l||!p){closeModal();return}
  const de=document.getElementById("vigor-data"), vigor=de?de.value:"";
  if(!vigor){toast("Indica a data em que a alteração entra em vigor");return}
  const changes=calcChanges(l,p);
  if(!changes.length){delete pendingEdits[id];closeModal();render();return}
  changes.forEach(c=>l[c.f]=c.val);
  delete pendingEdits[id];
  l.estado="alteracao_pendente";
  l.pedidoData=nowISO();            // reentra como tarefa nova em Compras
  (l.historico=l.historico||[]).push({ts:nowISO(),quem:perfil,txt:"Alteração pedida à Compras — "+changes.map(c=>c.txt).join("; "),vigor});
  await saveLinha(l);
  closeModal();
  toast("Alteração enviada (em vigor a "+new Date(vigor).toLocaleDateString("pt-PT")+")");
  render();
}

/* ===== Mensagens ===== */
const PERFIS=["Logística","Compras","Administrativo"];
function msgsDe(linhaId){return state.mensagens.filter(m=>m.linhaId===linhaId).sort((a,b)=>(a.ts||"").localeCompare(b.ts||""))}
function ehParaMim(m){return m.de!==perfil && (m.para===perfil||m.para==="Todos")}
function unreadDe(linhaId){return msgsDe(linhaId).filter(m=>ehParaMim(m)&&!(m.lidaPor||[]).includes(perfil)).length}
function unreadTotal(){return state.mensagens.filter(m=>ehParaMim(m)&&!(m.lidaPor||[]).includes(perfil)).length}
function msgBtn(linhaId){

async function openConversa(linhaId){currentConvLine=linhaId;await markReadConv(linhaId);renderConversaModal(linhaId);updateBadges();if(activeTab==="mensagens")renderMensagens()}
function renderConversaModal(linhaId){

  modal(`<h3>💬 Conversa — ${esc(l?(l.servico||l.id):linhaId)}</h3>
    <div class="info-line muted" style="margin-bottom:2px">${l?esc(l.nomeTransp||l.idTransp)+" · "+esc(l.categoria):"linha "+esc(linhaId)}</div>
    <div class="conv" id="convBox">${conv}</div>
    <label style="display:block;font-size:10.5px;text-transform:uppercase;letter-spacing:.04em;color:var(--text-3);font-weight:600;margin-bottom:2px">Nova mensagem · de ${esc(perfil)}</label>
    <div class="recipient-row">
      <select id="msg-para">${outros.map(r=>`<option value="${r}">Para ${r}</option>`).join("")}<option value="Todos">Para todos</option></select>
      <input id="msg-txt" placeholder="Escreve a mensagem e Enter…" onkeydown="if(event.key==='Enter')enviarMensagem('${linhaId}')">

/* ===== Filtros (multi-select) ===== */
function applyFilters(list){
  const inArr=(arr,v)=>!arr||!arr.length||arr.includes(v);
  const kmin=parseFloat(filters.kmMin), kmax=parseFloat(filters.kmMax);
  return list.filter(l=>{
    if(!inArr(filters.cats,l.categoria))return false;
    if(!inArr(filters.transps,l.idTransp))return false;
    if(!inArr(filters.origens,l.origem))return false;
    if(!inArr(filters.estados,l.estado))return false;
    const k=parseFloat(l.km);
    if(!isNaN(kmin)&&(isNaN(k)||k<kmin))return false;
    if(!isNaN(kmax)&&(isNaN(k)||k>kmax))return false;
    if(filters.q){const s=(l.idTransp+" "+l.nomeTransp+" "+l.servico+" "+l.carga+" "+l.descarga+" "+l.origem+" "+l.neNumero).toLowerCase();if(!s.includes(filters.q.toLowerCase()))return false}
    return true;
  });
}
function msDropdown(key,label,opts){
  const sel=filters[key]||[];const n=sel.length;
  return `<div class="ms" data-key="${key}">
    <button type="button" class="ms-btn${n?" on":""}" data-label="${esc(label)}" onclick="toggleMs('${key}')"><span class="ms-lbl">${esc(label)}${n?" · "+n:""}</span> ▾</button>
    <div class="ms-panel" id="ms-${key}" hidden>
      ${opts.map(o=>`<label class="ms-opt"><input type="checkbox" value="${esc(o.v)}" ${sel.includes(o.v)?"checked":""} onchange="msChange(this)"><span>${esc(o.l)}</span></label>`).join("")||'<div class="muted" style="padding:6px">Sem opções</div>'}
    </div>
  </div>`;
}
function toolbarHTML(showEstado){
  const cats=[...new Set(state.linhas.map(l=>l.categoria))].filter(Boolean).sort();

function toggleMs(key){const p=document.getElementById("ms-"+key);if(!p)return;const abrir=p.hidden;document.querySelectorAll(".ms-panel").forEach(x=>x.hidden=true);p.hidden=!abrir}
function msChange(cb){

/* colunas ajustáveis (arrastar borda direita do cabeçalho) */
function makeResizable(sel){
  const table=document.querySelector(sel);if(!table)return;
  table.querySelectorAll("thead th").forEach(th=>{
    if(th.querySelector(".col-resizer"))return;
    const h=document.createElement("span");h.className="col-resizer";th.appendChild(h);
    h.addEventListener("mousedown",e=>{
      e.preventDefault();e.stopPropagation();
      const startX=e.pageX,startW=th.offsetWidth;
      const move=ev=>{const w=Math.max(50,startW+(ev.pageX-startX));th.style.width=w+"px";th.style.minWidth=w+"px"};
      const up=()=>{document.removeEventListener("mousemove",move);document.removeEventListener("mouseup",up);document.body.style.userSelect=""};
      document.body.style.userSelect="none";
      document.addEventListener("mousemove",move);document.addEventListener("mouseup",up);
    });
  });
}

/* ===== KPI: tempo de ciclo (envio às Compras → conclusão) ===== */
function cicloStats(){
  const durs=state.linhas
    .filter(l=>l.pedidoData&&l.concluidoData)
    .map(l=>new Date(l.concluidoData)-new Date(l.pedidoData))
    .filter(ms=>!isNaN(ms)&&ms>=0);
  if(!durs.length)return null;
  const avg=durs.reduce((a,b)=>a+b,0)/durs.length;
  return {n:durs.length,avg,min:Math.min(...durs),max:Math.max(...durs)};
}
function fmtDur(ms){
  if(ms==null||isNaN(ms))return"—";
  const h=ms/3.6e6;
  if(h<1)return Math.max(1,Math.round(ms/6e4))+" min";
  if(h<24)return (Math.round(h*10)/10)+" h";
  return (Math.round(h/24*10)/10)+" dias";
}

      ${editable?`<div style="margin-top:8px;display:flex;gap:8px"><button class="btn sm green" onclick="concluir('${l.id}')">Concluir</button><button class="btn sm" onclick="reabrir('${l.id}')">Reabrir para pedido</button></div>`:""}
    </div>`;
  const cc=$("#compras-count");if(cc)cc.textContent=`${pend.length} tarefa(s) por tratar · ${abertas.length} encomenda(s) aberta(s)`;
  const body=$("#compras-body");if(body)body.innerHTML=`
    <div class="card" style="margin-bottom:16px"><div class="sh"><h2 style="font-size:13px">📥 Tarefas pendentes — pedidas pela Logística</h2></div>
      ${pend.map(taskCard).join("")||`<div class="empty">Sem pedidos pendentes. 🎉</div>`}</div>
    <div class="card"><div class="sh"><h2 style="font-size:13px">📦 Encomendas abertas</h2></div>
      ${abertas.map(abertaCard).join("")||`<div class="empty">Ainda sem encomendas abertas.</div>`}</div>`;
}

/* ===== ADMINISTRATIVO ===== */
function renderAdmin(){
  $("#sec-admin").innerHTML=`
    <div class="sh"><div><h2>Administrativo — visão global</h2><div class="sub">Acompanhamento em tempo real · <span id="adm-count"></span></div></div>
      <button class="btn" onclick="exportCSV()">⭳ Exportar CSV</button></div>

    <div class="table-wrap"><table>

}
function renderAdmBody(){
  const list=applyFilters(state.linhas).sort((a,b)=>(b.pedidoData||"").localeCompare(a.pedidoData||""));

    <td><span class="badge ${ESTADOS[l.estado].cls}">${ESTADOS[l.estado].label}</span></td>

    <td>${esc(l.nomeTransp||l.idTransp)}</td>
    <td>${esc(l.servico)}</td>
    <td>${esc(l.carga)} → ${esc(l.descarga)}</td>
    <td>${esc(l.origem)}</td>
    <td class="right">${fmtEur(l.preco)}</td>
    <td>${esc(l.unidade)}</td>
    <td>${esc(l.neNumero)||"—"}</td>
    <td>${l.neData?new Date(l.neData).toLocaleDateString("pt-PT"):"—"}</td>
    <td>${l.pedidoData?new Date(l.pedidoData).toLocaleDateString("pt-PT"):"—"}</td>
    <td style="white-space:nowrap"><button class="btn sm" onclick="verHist('${l.id}')">Histórico</button> ${msgBtn(l.id)}</td>

  const body=$("#adm-body");if(body)body.innerHTML=rows||`<tr><td colspan="12" class="empty">Sem registos.</td></tr>`;

}
function verHist(id){const l=getL(id);if(!l)return;
  const h=(l.historico||[]).slice().reverse().map(x=>`<div><b>${dtLabel(x.ts)}</b> · ${esc(x.quem)} — ${esc(x.txt)}</div>`).join("")||'<div class="muted">Sem histórico.</div>';
  modal(`<h3>Histórico — ${esc(l.servico||l.id)}</h3><div class="info-line" style="margin-bottom:10px">${esc(l.nomeTransp||l.idTransp)} · ${esc(l.categoria)}</div><div class="hist">${h}</div><div style="margin-top:16px;text-align:right"><button class="btn" onclick="closeModal()">Fechar</button></div>`);
}

/* ===== TRANSPORTADORES ===== */
function renderTransp(){
  const editable=perms.editLog();
  $("#sec-transp").innerHTML=`
    <div class="sh"><div><h2>Transportadores</h2><div class="sub"><span id="transp-count"></span> registados</div></div>
      ${editable?`<button class="btn primary" onclick="novoTransp()">+ Novo transportador</button>`:`<span class="chip">Só leitura (perfil ${esc(perfil)})</span>`}</div>
    <div class="toolbar"><input id="flt-qt" type="text" placeholder="Procurar…" value="${esc(filters.q)}" oninput="filters.q=this.value;renderTranspBody()">${filters.q?`<button class="btn sm" onclick="filters.q='';renderTransp()">Limpar</button>`:""}</div>
    <div class="table-wrap"><table>
      <thead><tr><th>ID</th><th>Nome</th><th>NIF</th><th>Telefone</th><th>Email</th><th>Ativo</th><th></th></tr></thead>
      <tbody id="transp-body"></tbody>
    </table></div>`;
  renderTranspBody();
  makeResizable("#sec-transp table");
}
function renderTranspBody(){
  const editable=perms.editLog();
  const list=state.transp.slice().sort((a,b)=>a.nome.localeCompare(b.nome));
  const q=(filters.q||"").toLowerCase();
  const shown=q?list.filter(t=>(t.id+t.nome+t.nif+t.email).toLowerCase().includes(q)):list;
  const rows=shown.map(t=>`<tr>
    <td><input ${editable?"":"disabled"} value="${esc(t.id)}" disabled title="ID não editável"></td>
    <td style="min-width:200px"><input ${editable?"":"disabled"} value="${esc(t.nome)}" onchange="editT('${t.id}','nome',this.value)"></td>
    <td><input ${editable?"":"disabled"} value="${esc(t.nif)}" onchange="editT('${t.id}','nif',this.value)"></td>
    <td><input ${editable?"":"disabled"} value="${esc(t.telefone)}" onchange="editT('${t.id}','telefone',this.value)"></td>
    <td><input ${editable?"":"disabled"} value="${esc(t.email)}" onchange="editT('${t.id}','email',this.value)"></td>
    <td style="text-align:center"><select ${editable?"":"disabled"} onchange="editT('${t.id}','ativo',this.value)"><option${t.ativo==="Sim"?" selected":""}>Sim</option><option${t.ativo==="Não"?" selected":""}>Não</option></select></td>
    <td>${editable?`<button class="btn sm ghost-red" onclick="askDelT('${t.id}')">✕</button>`:""}</td>
  </tr>`).join("");
  const body=$("#transp-body");if(body)body.innerHTML=rows||`<tr><td colspan="7" class="empty">Sem transportadores.</td></tr>`;
  const c=$("#transp-count");if(c)c.textContent=list.length;
}
async function editT(id,f,v){const t=state.transp.find(x=>x.id===id);if(!t)return;t[f]=v;await saveTransp(t)}
function novoTransp(){
  modal(`<h3>Novo transportador</h3>
    <div class="field" style="margin-bottom:8px"><label>ID (curto, único)</label><input id="nt-id" placeholder="ex. Miranda"></div>
    <div class="field" style="margin-bottom:8px"><label>Nome completo</label><input id="nt-nome"></div>
    <div class="grid-2" style="margin-bottom:8px"><div class="field"><label>NIF</label><input id="nt-nif"></div><div class="field"><label>Telefone</label><input id="nt-tel"></div></div>
    <div class="field" style="margin-bottom:14px"><label>Email</label><input id="nt-email"></div>
    <div style="text-align:right;display:flex;gap:8px;justify-content:flex-end"><button class="btn" onclick="closeModal()">Cancelar</button><button class="btn primary" onclick="criarTransp()">Criar</button></div>`);
}
async function criarTransp(){
  const id=$("#nt-id").value.trim(),nome=$("#nt-nome").value.trim();
  if(!id||!nome){toast("ID e nome obrigatórios");return}
  if(state.transp.some(t=>t.id===id)){toast("Já existe um transportador com esse ID");return}
  await saveTransp({id,nome,nif:$("#nt-nif").value.trim(),telefone:$("#nt-tel").value.trim(),email:$("#nt-email").value.trim(),contacto:"",ativo:"Sim",obs:""});
  closeModal();toast("Transportador criado");render();
}
function novaLinha(){
  const tps=state.transp.slice().sort((a,b)=>a.nome.localeCompare(b.nome));
  let cats=(state.config&&state.config.tipos)||["Basculantes","MBQ|MBF|BT","T.Especial","Eco Impact"];
  cats=cats.map(c=>c==="Agregados"?"Basculantes":c);
  const unids=(state.config&&state.config.unidades)||["€/ton","€/m3","€/km","€/viagem","€/hora","€/serviço"];
  const ors=[...new Set(state.linhas.map(l=>l.origem))].filter(Boolean).sort();
  modal(`<h3>Nova rota</h3>
    <div class="field" style="margin-bottom:8px"><label>Categoria</label><select id="nl-cat">${cats.map(c=>`<option>${esc(c)}</option>`).join("")}</select></div>
    <div class="field" style="margin-bottom:8px"><label>Transportador(es) — um ou vários (uma rota por transportador)</label>
      <div class="ms" style="display:block">
        <button type="button" class="ms-btn" id="nl-transp-btn" onclick="toggleNlTransp()" style="width:100%;justify-content:space-between"><span id="nl-transp-lbl">Selecionar transportador(es)…</span><span>▾</span></button>
        <div class="ms-panel" id="nl-transp-panel" hidden style="min-width:100%;max-height:none;overflow:visible">
          <input type="text" id="nl-transp-q" placeholder="Procurar transportador…" oninput="filterNlTransp(this.value)" style="width:100%;font-family:inherit;font-size:12.5px;padding:7px 8px;border:1px solid var(--border-2);border-radius:6px;margin-bottom:6px;background:var(--surface);color:var(--text)">
          <div id="nl-transp-list" style="max-height:200px;overflow:auto">
            ${tps.map(t=>`<label class="ms-opt" data-nome="${esc(((t.nome||"")+" "+(t.id||"")).toLowerCase())}"><input type="checkbox" class="nl-transp-cb" value="${esc(t.id)}" onchange="updateNlTranspLbl()"><span>${esc(t.nome)}</span></label>`).join("")||'<div class="muted" style="padding:6px">Sem transportadores. Cria primeiro no TAB Transportadores.</div>'}
          </div>
        </div>
      </div>
    </div>
    <div class="field" style="margin-bottom:8px"><label>Serviço / Rota</label><input id="nl-serv"></div>
    <div class="grid-2" style="margin-bottom:8px"><div class="field"><label>Local de carga</label><input id="nl-carga"></div><div class="field"><label>Local de descarga</label><input id="nl-desc"></div></div>
    <div class="grid-3" style="margin-bottom:8px">
      <div class="field"><label>Origem</label><select id="nl-origem"><option value=""></option>${ors.map(o=>`<option>${esc(o)}</option>`).join("")}</select></div>
      <div class="field"><label>Unidade</label><select id="nl-unid">${unids.map(u=>`<option>${esc(u)}</option>`).join("")}</select></div>
      <div class="field"><label>Preço</label><input id="nl-preco" type="number" step="0.01"></div>
    </div>
    <div class="field" style="margin-bottom:14px"><label>Km</label><input id="nl-km" type="number" step="0.1" style="max-width:120px"></div>
    <div style="text-align:right;display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap"><button class="btn" onclick="closeModal()">Cancelar</button><button class="btn" onclick="criarLinhas(false)">Guardar rascunho</button><button class="btn primary" onclick="criarLinhas(true)">Criar e enviar às Compras →</button></div>`);
}
async function criarLinhas(enviar){
  const ids=[...document.querySelectorAll(".nl-transp-cb:checked")].map(c=>c.value);
  if(!ids.length){toast("Escolhe pelo menos um transportador");return}
  const cat=$("#nl-cat").value,serv=$("#nl-serv").value.trim(),carga=$("#nl-carga").value.trim(),
    desc=$("#nl-desc").value.trim(),origem=$("#nl-origem").value,unid=$("#nl-unid").value,
    preco=$("#nl-preco").value,km=$("#nl-km").value;
  for(const tid of ids){
    const t=state.transp.find(x=>x.id===tid);
    const l={id:uid("L"),categoria:cat,idTransp:tid,nomeTransp:t?t.nome:tid,servico:serv,carga:carga,descarga:desc,
      origem:origem,unidade:unid,preco:preco,km:km,obs:"",precisaNE:true,neNumero:"",neData:"",comprasObs:"",concluidoData:""};
    if(enviar){l.estado="pedido";l.pedidoData=nowISO();l.historico=[{ts:nowISO(),quem:perfil,txt:"Rota criada e enviada para Compras"}]}
    else{l.estado="rascunho";l.pedidoData="";l.historico=[{ts:nowISO(),quem:perfil,txt:"Rota criada (rascunho)"}]}
    await saveLinha(l);
  }
  closeModal();
  toast(`${ids.length} ${ids.length>1?"rotas":"rota"} ${enviar?"enviada(s) para Compras":"gravada(s) em rascunho"}`);
  render();
}
function toggleNlTransp(){
  const p=document.getElementById("nl-transp-panel");if(!p)return;
  const abrir=p.hidden;
  document.querySelectorAll(".ms-panel").forEach(x=>x.hidden=true);
  p.hidden=!abrir;
  if(!p.hidden){const q=document.getElementById("nl-transp-q");if(q)setTimeout(()=>q.focus(),30)}
}
function filterNlTransp(v){
  const s=(v||"").toLowerCase().trim();
  document.querySelectorAll("#nl-transp-list .ms-opt").forEach(l=>{
    const nome=l.getAttribute("data-nome")||"";
    l.style.display=(s&&nome.indexOf(s)<0)?"none":"";
  });
}
function updateNlTranspLbl(){
  const n=document.querySelectorAll(".nl-transp-cb:checked").length;
  const lbl=document.getElementById("nl-transp-lbl"),btn=document.getElementById("nl-transp-btn");
  if(lbl)lbl.textContent=n?`${n} transportador${n>1?"es":""} selecionado${n>1?"s":""}`:"Selecionar transportador(es)…";
  if(btn)btn.classList.toggle("on",!!n);
}
function askDel(id){const l=getL(id);modal(`<h3>Eliminar rota?</h3><p class="info-line">${esc(l.servico||"")} · ${esc(l.nomeTransp)}</p><div style="margin-top:16px;text-align:right;display:flex;gap:8px;justify-content:flex-end"><button class="btn" onclick="closeModal()">Cancelar</button><button class="btn primary" style="background:var(--red);border-color:var(--red)" onclick="doDel('${id}')">Eliminar</button></div>`)}
async function doDel(id){const l=getL(id);if(!podeEliminar(l)){toast("Linha já aberta — não pode ser eliminada (circuito fechado)");closeModal();return}await delLinha(id);closeModal();render()}
function askDelT(id){const t=state.transp.find(x=>x.id===id);modal(`<h3>Eliminar transportador?</h3><p class="info-line">${esc(t.nome)}</p><p class="muted">As rotas associadas não são apagadas.</p><div style="margin-top:16px;text-align:right;display:flex;gap:8px;justify-content:flex-end"><button class="btn" onclick="closeModal()">Cancelar</button><button class="btn primary" style="background:var(--red);border-color:var(--red)" onclick="doDelT('${id}')">Eliminar</button></div>`)}
async function doDelT(id){await delTransp(id);closeModal();render()}

/* ===== Export ===== */
function exportCSV(){
  const cols=["Estado","Categoria","ID Transp","Transportador","Serviço/Rota","Carga","Descarga","Origem","Unidade","Preço","Km","Precisa NE","Nº NE","Data NE","Obs Compras","Pedido em","Concluído em"];
  const rows=applyFilters(state.linhas).map(l=>[ESTADOS[l.estado].label,l.categoria,l.idTransp,l.nomeTransp,l.servico,l.carga,l.descarga,l.origem,l.unidade,l.preco,l.km,l.precisaNE?"Sim":"Não",l.neNumero,l.neData,l.comprasObs,l.pedidoData,l.concluidoData]);
  const csv=[cols,...rows].map(r=>r.map(c=>`"${String(c==null?"":c).replace(/"/g,'""')}"`).join(";")).join("\r\n");
  const blob=new Blob(["﻿"+csv],{type:"text/csv;charset=utf-8"});
  const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="Fluxo_Compras_Logistica_"+new Date().toISOString().slice(0,10)+".csv";a.click();
  toast("CSV exportado");
}

/* ===== MENSAGENS (TAB) ===== */
function renderMensagens(){
  const byLine={};
  state.mensagens.forEach(m=>{(byLine[m.linhaId]=byLine[m.linhaId]||[]).push(m)});
  const items=Object.keys(byLine).map(lid=>{
    const ms=byLine[lid].slice().sort((a,b)=>(b.ts||"").localeCompare(a.ts||""));
    return {lid,last:ms[0],n:ms.length,u:unreadDe(lid),l:getL(lid)};
  }).sort((a,b)=>(b.last.ts||"").localeCompare(a.last.ts||""));
  const html=items.map(it=>`<div class="conv-item ${it.u?"unread":""}" onclick="openConversa('${it.lid}')">
    <div style="display:flex;justify-content:space-between;gap:10px;align-items:flex-start">
      <div><b>${esc(it.l?(it.l.servico||it.l.id):it.lid)}</b> ${it.l?`<span class="chip">${esc(it.l.categoria)}</span>`:`<span class="chip">linha removida</span>`}</div>
      <div class="muted" style="white-space:nowrap">${dtLabel(it.last.ts)} ${it.u?`<span class="msg-count" style="position:static;display:inline-block;vertical-align:middle">${it.u}</span>`:""}</div>
    </div>
    ${it.l?`<div class="info-line muted" style="margin-top:3px">${esc(it.l.nomeTransp||it.l.idTransp)}</div>`:""}
    <div class="info-line" style="margin-top:4px"><b>${esc(it.last.de)} → ${esc(it.last.para)}:</b> ${esc(it.last.texto.slice(0,140))}${it.last.texto.length>140?"…":""} <span class="muted">· ${it.n} msg</span></div>
  </div>`).join("")||`<div class="empty">Ainda sem mensagens.<br>Abre uma linha em qualquer TAB e clica no 💬 para iniciar uma conversa referente a essa rota.</div>`;
  $("#sec-mensagens").innerHTML=`
    <div class="sh"><div><h2>Mensagens</h2><div class="sub">${items.length} conversa(s) · ${unreadTotal()} por ler · cada conversa está ligada a uma rota/tarefa</div></div></div>
    ${html}`;
}

/* ===== Modal ===== */
function modal(html){$("#modalRoot").innerHTML=`<div class="modal-bg" onclick="if(event.target===this)closeModal()"><div class="modal">${html}</div></div>`}
function closeModal(){$("#modalRoot").innerHTML="";currentConvLine=null}

init();
</script>
